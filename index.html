<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Maikey Adventure</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="orientation-blocker">
        <div class="blocker-message">
            🔄 画面を横向きに回転させてね！<br>
            <span>（スマホの画面回転ロックを解除してね❤️）</span>
        </div>
    </div>
    
    <div class="control-panel" style="text-align: center; margin: 10px 0;">
        <button id="btnFullscreen" style="padding: 8px 16px; font-weight: bold; background: #FF4500; color: white; border: none; border-radius: 4px; cursor: pointer;">
            📺 フルスクリーン＆横画面で遊ぶ⭐
        </button>
    </div>
    
    <div class="handheld-console">
        <div class="d-pad-area">
            </div>
        <div class="screen-area">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div class="action-area">
            </div>
    </div>
    
    <script src="player-data.js"></script>
    <script src="main.js"></script>
</body>
</html>
