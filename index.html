<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Maikey Adventure</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div id="dpad-container" class="touch-controls hidden">
            <button id="btn-up" class="dpad-btn">▲</button>
            <div class="dpad-horizontal">
                <button id="btn-left" class="dpad-btn">◀</button>
                <div class="dpad-center"></div>
                <button id="btn-right" class="dpad-btn">▶</button>
            </div>
            <button id="btn-down" class="dpad-btn">▼</button>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="rotate-message" class="hidden">
            ⭐ スマホを横向きにしてください ⭐
        </div>

        <div id="action-container" class="touch-controls hidden">
            <button id="btn-b" class="action-btn">B</button>
            <button id="btn-a" class="action-btn">A</button>
        </div>
    </div>
    
    <script src="player-data.js"></script>
    <script src="main.js"></script>
</body>
</html>
